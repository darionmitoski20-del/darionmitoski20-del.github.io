<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7466">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Мој тренинг и исхрана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: dark one-column gym app. Muscle figures with red highlights, card grid library, fixed bottom tabs. Red = training, amber = food. */
  --bg:#0A0A0D; --surface:#17171D; --surface-2:#22222B; --ink:#F3F3F6; --muted:#8E8E9C; --line:#2A2A34;
  --train:#FF4D42; --train-soft:#3A1715; --food:#F2A93B; --food-soft:#33250F; --on-accent:#FFFFFF;
  --good:#3DD68C; --bad:#FF6B5E; --body-fig:#3B3B47; --body-line:#55556380;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--train);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
header.top h1{font-size:22px;text-transform:uppercase}
header.top .date{color:var(--muted);font-size:13px;font-weight:600;text-align:right}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:10px;background:var(--food-soft);color:var(--ink);font-size:13px}
.banner[hidden]{display:none}
main{flex:1;padding:16px calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));min-width:0;display:flex;flex-direction:column;gap:18px}
section.block{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head>*{min-width:0}
.sec-head h2{font-size:18px;text-transform:uppercase}
.sec-head .meta{color:var(--muted);font-size:13px;font-weight:600}
.kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--train)}
.food .kicker{color:var(--food)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.list{display:flex;flex-direction:column}
.list>.item+.item{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:12px;min-height:60px}
.item .grow{flex:1;min-width:0}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:34px;height:34px;position:relative;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.chk svg{width:17px;height:17px;opacity:0}
.chk::after{content:"";position:absolute;inset:-6px}
.chk[aria-pressed="true"]{background:var(--train);border-color:var(--train);color:var(--on-accent)}
.food .chk[aria-pressed="true"]{background:var(--food);border-color:var(--food)}
.chk[aria-pressed="true"] svg{opacity:1}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn.play{background:var(--train-soft);border-color:transparent;color:var(--train)}
.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:46px;font-size:15px}
.btn-primary{background:var(--train);border-color:var(--train);color:var(--on-accent)}
.btn-food{background:var(--food);border-color:var(--food);color:var(--on-accent)}
.btn-danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--train);border-radius:99px;transition:width .3s}
.food .progress>i{background:var(--food)}
.empty{padding:18px 14px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.rest-day{padding:18px 14px;display:flex;gap:12px;align-items:center}
.rest-day b{font-family:var(--display);font-size:20px;text-transform:uppercase;color:var(--train)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0 7px;min-height:48px;min-width:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px}
.day small{font-size:11px;font-weight:600;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--train);border-color:var(--train);color:var(--on-accent)}
.day[aria-pressed="true"] small{color:inherit;opacity:.85}
.food .day[aria-pressed="true"]{background:var(--food);border-color:var(--food)}
.day.today{box-shadow:inset 0 -3px 0 var(--train)}
.food .day.today{box-shadow:inset 0 -3px 0 var(--food)}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=number],input[type=url],input[type=date],input:not([type]),select,textarea{width:100%;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
textarea{resize:vertical}
input[type=file]{font-size:13px;max-width:100%}
.field{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .btn{flex:none}
.inline .field{flex:1}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);font-size:14px;margin:0;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--train)}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile-card .name{font-weight:800;overflow-wrap:anywhere}
.tile-card .sub{font-size:12px;color:var(--muted)}
.tile-card .thumb{margin:-12px -12px 4px;height:96px;border-radius:13px 13px 0 0;background:var(--surface-2) center/cover no-repeat}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--train-soft);color:var(--train);align-self:flex-start}
.tag.food{background:var(--food-soft);color:var(--food)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .val small{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:700;margin-left:3px}
.stat .val.down{color:var(--good)} .stat .val.up{color:var(--bad)}
.chart{padding:10px 8px 4px}
.chart svg{width:100%;height:auto;display:block}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:12px}
.wk{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted)}
.wk i{width:100%;aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--muted)}
.wk.full i{background:var(--train);color:var(--on-accent)}
.wk.part i{background:var(--train-soft);color:var(--train)}
.wk.rest i{background:transparent;border:1px dashed var(--line)}
.wk.now{color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.kcal{font-weight:800;font-variant-numeric:tabular-nums;color:var(--food);white-space:nowrap;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:8px 0 6px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--train)}
.tab[data-tab="food"][aria-current="page"]{color:var(--food)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,10,9,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;max-height:92dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet h2{font-size:22px;text-transform:uppercase}
.sheet form{display:flex;flex-direction:column;gap:12px}
.sheet video,.sheet .photo{width:100%;border-radius:12px;background:#000;max-height:360px}
.sheet .photo{object-fit:cover;background:var(--surface-2)}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--bg);padding:10px 0 4px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font-weight:800;font-size:13px;padding:0 6px}
.form-msg{margin:0;font-size:13px;font-weight:700;color:var(--bad);min-height:1em}
.form-msg.ok{color:var(--muted)}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.fact span{color:var(--muted);font-weight:600;margin-right:4px}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;width:max-content;text-align:center;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.starter{background:var(--train-soft);border:0}
.starter p{margin:0}
.btn-finish{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;font-size:16px;border-radius:14px;width:100%}
.btn-finish svg{width:20px;height:20px}
.btn-finish small{font-size:13px;opacity:.8;font-weight:700}
.finished{display:flex;align-items:center;gap:12px;padding:14px;background:var(--train-soft);border-color:transparent}
.finished b{font-family:var(--display);font-size:17px;line-height:1.2;display:block;text-transform:uppercase;color:var(--train);font-weight:600}
.finished .sub{font-size:13px;color:var(--muted)}
.fin-icon{flex:none;width:44px;height:44px;border-radius:50%;background:var(--train);color:var(--on-accent);display:grid;place-items:center}
.fin-icon svg{width:24px;height:24px}
.pill-done{display:inline-flex;align-items:center;gap:4px;background:var(--train);color:var(--on-accent);font-size:12px;font-weight:800;padding:4px 9px 4px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.pill-done svg{width:14px;height:14px}

.mrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.mrow::-webkit-scrollbar{display:none}
.mtile{flex:none;width:68px;border:2px solid transparent;background:var(--surface);border-radius:14px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:700}
.mtile svg{width:38px;height:56px}
.mtile[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.mtile .ico{width:38px;height:56px;display:grid;place-items:center}
.mtile .ico svg{width:24px;height:24px}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.excard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.excard .open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
.excard .open:focus-visible{outline:2px solid var(--train);outline-offset:-2px;border-radius:16px}
.thumb-box{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 40%,#23232c,#121217);display:grid;place-items:center;overflow:hidden}
.thumb-box svg.fig{height:82%;width:auto}
.thumb-box img,.thumb-box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb-box .badge{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.thumb-box .badge svg{width:13px;height:13px;margin-left:2px}
.excard .meta2{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.excard .nm{font-weight:800;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.excard .mu{font-size:12px;color:var(--muted);font-weight:600}
.fav{position:absolute;left:6px;top:6px;z-index:2;width:36px;height:36px;border:0;border-radius:10px;background:rgba(10,10,13,.55);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--train)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.mini{flex:none;width:46px;height:46px;border-radius:11px;background:radial-gradient(circle at 50% 40%,#26262f,#141419);display:grid;place-items:center;overflow:hidden;position:relative}
.mini svg.fig{height:88%;width:auto}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-media{position:relative;display:block;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#23232c,#121217);aspect-ratio:16/10;display:grid;place-items:center;text-decoration:none;color:#fff}
.hero-media svg.fig{height:86%;width:auto}
.hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-media .playbig{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--train);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.hero-media .playbig svg{width:24px;height:24px;margin-left:3px}
.hero-media .cap{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:7px}
.tchk{position:absolute;right:8px;top:8px;z-index:2;width:36px;height:36px;background:rgba(10,10,13,.6);border-color:rgba(255,255,255,.35)}
.excard.is-done{border-color:var(--good)}
.excard.is-done .tchk{background:var(--good);border-color:var(--good);color:#0A0A0D}
.excard.is-done .thumb-box{opacity:.45}
.excard.is-done .nm{text-decoration:line-through;color:var(--muted)}
@media (max-width:400px){header.top h1{font-size:20px}.stat .val{font-size:24px}.stat{padding:10px 12px}.lib{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-card{min-height:96px}.seg button{font-size:14px;padding:10px 4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title">Денес</h1>
    <div class="date" id="today-date"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Делови">
  <div class="in">
    <button class="tab" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>Денес</button>
    <button class="tab" data-act="tab" data-tab="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Тренинг</button>
    <button class="tab" data-act="tab" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M11 3v8a2 2 0 0 1-2 2M17 21V3c-2 1.5-3 4-3 7s1 3 3 3"/></svg>Исхрана</button>
    <button class="tab" data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Напредок</button>
  </div>
</nav>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const DAYS=[["mon","Понеделник","Пон"],["tue","Вторник","Вто"],["wed","Среда","Сре"],["thu","Четврток","Чет"],["fri","Петок","Пет"],["sat","Сабота","Саб"],["sun","Недела","Нед"]];
const MONTHS=["јануари","февруари","март","април","мај","јуни","јули","август","септември","октомври","ноември","декември"];
const MUSCLES=["Гради","Грб","Нозе","Рамо","Раце","Стомак","Кардио","Цело тело"];
const SLOTS=[["breakfast","Појадок"],["snack","Ужина"],["lunch","Ручек"],["dinner","Вечера"]];
const RCATS=["Појадок","Ужина","Ручек","Вечера"];
const MAXB=100*1024*1024;
const TABS={today:"Денес",training:"Тренинг",food:"Исхрана",progress:"Напредок"};

const $=s=>document.querySelector(s);
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad2=n=>String(n).padStart(2,"0");

const dayIdx=(d=new Date())=>(d.getDay()+6)%7;
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const fmtLong=k=>{const d=parseKey(k);return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();};
const fmtShort=k=>{const d=parseKey(k);return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);};
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:null;};

function emptyPlan(){const p={train:{},title:{},rest:{},meals:{},goal:null};DAYS.forEach(([k])=>{p.train[k]=[];p.title[k]="";p.rest[k]=false;p.meals[k]={};});return p;}
function normPlan(d){const p=emptyPlan();if(!d)return p;DAYS.forEach(([k])=>{
  if(Array.isArray(d.train&&d.train[k]))p.train[k]=d.train[k].filter(x=>typeof x==="string");
  if(d.title&&typeof d.title[k]==="string")p.title[k]=d.title[k];
  p.rest[k]=!!(d.rest&&d.rest[k]);
  if(d.meals&&d.meals[k]&&typeof d.meals[k]==="object")p.meals[k]={...d.meals[k]};
});if(typeof d.goal==="number")p.goal=d.goal;if(typeof d.program==="string")p.program=d.program;if(typeof d.mealProgram==="string")p.mealProgram=d.mealProgram;return p;}

const exById=id=>S.exercises.find(e=>e.id===id);
const recById=id=>S.recipes.find(r=>r.id===id);
const logFor=k=>{const l=S.logs[k]||{};const o={ex:{...(l.ex||{})},meals:{...(l.meals||{})}};if(typeof l.finished==="number")o.finished=l.finished;return o;};
const hhmm=t=>{const d=new Date(t);return pad2(d.getHours())+":"+pad2(d.getMinutes());};

/* ---------- saving: one write at a time per document ---------- */
const Q={};
function errMsg(e){return e&&e.code==="quota_exceeded"?"Просторот за податоци е полн. Избриши некои стари записи.":"Не успеа зачувувањето. Провери ја врската и обиди се повторно.";}
function persist(ref,data){if(!ref)return Promise.resolve();const k=ref.path;Q[k]=(Q[k]||Promise.resolve()).then(()=>ref.set(JSON.parse(JSON.stringify(data)))).catch(e=>toast(errMsg(e)));return Q[k];}
function erase(ref){if(!ref)return Promise.resolve();const k=ref.path;Q[k]=(Q[k]||Promise.resolve()).then(()=>ref.delete()).catch(e=>toast(errMsg(e)));return Q[k];}
const strip=o=>{const c={...o};delete c.id;return c;};
async function dropAsset(m){if(m&&m.id&&assets){try{await assets.delete(m.id);}catch(e){}}}

function savePlan(){persist(refs&&refs.plan,S.plan);}
function upsert(list,obj){const i=list.findIndex(x=>x.id===obj.id);if(i>=0)list[i]=obj;else list.push(obj);}

/* ---------- toast / banner / modal ---------- */

function setBanner(t){const b=$("#banner");b.textContent=t||"";b.hidden=!t;}

function figSVG(muscle,cls="fig"){
  const m=MUSCLE_MAP[muscle]||{on:[],mus:[]};
  const base=Object.entries(FIG_FRONT).map(([k,v])=>m.on.includes(k)?"":v).join("");
  const hot=m.on.map(k=>FIG_FRONT[k]).join("")+m.mus.map(k=>FIG_MUS[k]).join("");
  const lines=m.back?'<path d="M30 20L30 50" stroke="#0005" stroke-width=".8" fill="none"/>':'';
  return `<svg class="${cls}" viewBox="0 0 60 100" aria-hidden="true"><g fill="var(--body-fig)" stroke="var(--body-line)" stroke-width=".6">${base}</g>${lines}<g fill="var(--train)">${hot}</g></svg>`;
}
function ytId(u){if(!u)return "";const m=String(u).match(/(?:youtube\.com\/(?:shorts\/|embed\/|live\/)|youtu\.be\/|[?&]v=)([A-Za-z0-9_-]{11})/);return m?m[1]:"";}
const ytThumb=id=>"https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";
function mediaThumb(e){
  if(e.video&&mediaUrl(e.video))return `<video src="${h(mediaUrl(e.video))}#t=0.5" muted playsinline preload="metadata"></video>`;
  const y=ytId(e.link);if(y)return `<img data-fallback src="${h(ytThumb(y))}" alt="" loading="lazy">`;
  return "";
}
function hookThumbs(root){root.querySelectorAll("img[data-fallback]").forEach(img=>{const kill=()=>img.remove();if(img.complete&&!img.naturalWidth)kill();else img.addEventListener("error",kill,{once:true});});}

/* ---------- views ---------- */
function dayChips(sel,act,counter){
  const ti=dayIdx();
  return `<div class="days" role="group" aria-label="Ден во неделата">${DAYS.map(([k,full,sh],i)=>`<button class="day${i===ti?" today":""}" data-act="${act}" data-i="${i}" aria-pressed="${i===sel}" aria-label="${full}">${sh}<small>${h(counter(k))}</small></button>`).join("")}</div>`;
}
function starterCard(){
  const mc=mealCard();
  return programCard()+mc+(S.recipes.length||mc?"":`<div class="card pad"><div class="kicker" style="color:var(--food)">Исхрана</div><p style="margin:0">Сè уште нема рецепти. Вчитај 5 примерни рецепти со план за јадење, или додај свои.</p><div class="btn-row"><button class="btn btn-food" data-act="seed">Вчитај примерни рецепти</button><button class="btn" data-act="go" data-tab="food" data-view="lib">Додај свој рецепт</button></div></div>`);
}
function exSub(e){const p=[];if(e.sets)p.push(e.sets+" × "+(e.reps||"?"));else if(e.reps)p.push(e.reps);if(e.muscle)p.push(e.muscle);if(+e.rest>0)p.push("одмор "+e.rest+" сек");return p.join(" · ");}

function viewToday(){
  const tk=todayKey(),di=dayIdx(),[dk,dayName]=DAYS[di];
  const log=logFor(tk);
  const ids=S.plan.train[dk].filter(exById);
  const doneN=ids.filter(id=>log.ex[id]).length;
  const title=S.plan.title[dk];
  let train;
  if(S.plan.rest[dk]) train=`<div class="card rest-day"><b>Ден за одмор</b><span class="note">Опоравувањето е дел од тренингот.</span></div>`;
  else if(!ids.length) train=`<div class="card empty">Нема вежби во планот за ${dayName.toLowerCase()}.<button class="btn" data-act="go" data-tab="training" data-view="plan" data-day="${di}">Пополни го планот</button></div>`;
  else train=`<div class="progress" aria-label="Завршени вежби"><i style="width:${Math.round(doneN/ids.length*100)}%"></i></div>
    <div class="exgrid">${ids.map(id=>todayCard(exById(id),!!log.ex[id])).join("")}</div>
    ${log.finished?`<div class="card finished"><div class="fin-icon">${ICON.check}</div><div class="grow"><b>Тренингот е завршен</b><div class="sub">Завршен во ${hhmm(log.finished)} · ${doneN}/${ids.length} вежби</div></div><button class="btn" data-act="unfinish" style="flex:none;min-height:40px;padding:8px 12px">Врати</button></div>`
     :`<button class="btn btn-primary btn-finish" data-act="finish">${ICON.check}<span>Заврши тренинг</span>${doneN<ids.length?`<small class="num">${doneN}/${ids.length}</small>`:""}</button>`}`;

  const meals=S.plan.meals[dk]||{};
  const slots=SLOTS.filter(([s])=>recById(meals[s]));
  const mealsDone=slots.filter(([s])=>log.meals[s]).length;
  const kTotal=slots.reduce((a,[s])=>a+(num(recById(meals[s]).kcal)||0),0);
  const pTotal=slots.reduce((a,[s])=>a+(num(recById(meals[s]).protein)||0),0);
  const food=!slots.length?`<div class="card empty">Нема оброци во планот за денес.<button class="btn" data-act="go" data-tab="food" data-view="plan" data-day="${di}">Направи план за јадење</button></div>`
   :`<div class="progress"><i style="width:${Math.round(mealsDone/slots.length*100)}%"></i></div><div class="card list">${slots.map(([s,lbl])=>{const r=recById(meals[s]),d=!!log.meals[s];
     return `<div class="item${d?" done":""}"><button class="chk" data-act="tog-meal" data-slot="${s}" aria-pressed="${d}" aria-label="Изедено: ${h(r.name)}">${ICON.check}</button>
     <button class="linkish grow" data-act="open-rec" data-id="${h(r.id)}"><div class="sub">${lbl}</div><div class="name">${h(r.name)}</div></button>${num(r.kcal)?`<span class="kcal">${num(r.kcal)} kcal</span>`:""}</div>`;}).join("")}</div>`;

  const lastW=S.weights[S.weights.length-1];
  const todayW=S.weights.find(w=>w.id===tk);
  return `${starterCard()}
  <section class="block"><div class="sec-head"><div><div class="kicker">Тренинг · ${dayName}</div><h2>${h(title||(S.plan.rest[dk]?"Одмор":"Денешен тренинг"))}</h2></div>${ids.length&&!S.plan.rest[dk]?(log.finished?`<span class="pill-done">${ICON.check}Завршен</span>`:`<span class="meta num">${doneN}/${ids.length} готово</span>`):""}</div>${train}</section>
  <section class="block food"><div class="sec-head"><div><div class="kicker">Исхрана</div><h2>Оброци денес</h2></div>${slots.length?`<span class="meta num">${kTotal?kTotal+" kcal":""}${pTotal?" · "+pTotal+" г протеин":""}</span>`:""}</div>${food}</section>
  <section class="block"><div class="sec-head"><div><div class="kicker">Килажа</div><h2>Измери се</h2></div>${lastW?`<span class="meta num">последно ${kgFmt(lastW.kg)} kg · ${fmtShort(lastW.date)}</span>`:""}</div>
   <div class="card pad"><div class="inline"><div class="field"><label for="q-kg">Килажа денес (kg)</label><input id="q-kg" inputmode="decimal" placeholder="${lastW?kgFmt(lastW.kg):"на пр. 78,5"}" value="${todayW?kgFmt(todayW.kg):""}"></div><button class="btn btn-primary" data-act="q-weight">Зачувај</button></div></div></section>`;
}

    <div class="field"><label for="plan-title">Име на тренингот</label><input id="plan-title" data-change="plan-title" maxlength="40" placeholder="на пр. Гради и рамо" value="${h(S.plan.title[dk])}"></div>
  </div>
  ${S.plan.rest[dk]?"":`<div class="card list">${ids.length?ids.map((id,j)=>{const e=exById(id);return `<div class="item"><span class="num" style="color:var(--muted);font-weight:800;width:18px">${j+1}</span><button class="linkish grow" data-act="open-ex" data-id="${h(id)}"><div class="name">${h(e.name)}</div><div class="sub">${h(exSub(e))}</div></button>

function chartSVG(ws,goal){
  const W=360,H=210,pl=38,pr=14,pt=14,pb=26;
  const vals=ws.map(w=>w.kg);if(goal)vals.push(goal);
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<2){mn-=1;mx+=1;}
  const pd=(mx-mn)*.12;mn=Math.floor(mn-pd);mx=Math.ceil(mx+pd);
  const t=w=>parseKey(w.date).getTime(),t0=t(ws[0]),t1=t(ws[ws.length-1]),span=t1-t0||1;
  const X=w=>ws.length===1?pl+(W-pl-pr)/2:pl+(t(w)-t0)/span*(W-pl-pr);
  const Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const ticks=[0,1,2,3].map(i=>mn+(mx-mn)*i/3);
  const pts=ws.map(w=>[X(w),Y(w.kg)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=ws.length>1?line+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`:"";
  const last=pts[pts.length-1],lw=ws[ws.length-1];
  const lx=Math.min(Math.max(last[0],pl+24),W-pr-24);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Графикон на килажата">
  <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--train)" stop-opacity=".28"/><stop offset="1" stop-color="var(--train)" stop-opacity="0"/></linearGradient></defs>
  ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Manrope,sans-serif">${Math.round(v*10)/10}</text>`).join("")}
  ${goal?`<line x1="${pl}" x2="${W-pr}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="var(--food)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr}" y="${(Y(goal)-5).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="var(--food)" font-family="Manrope,sans-serif">цел ${kgFmt(goal)}</text>`:""}
  ${area?`<path d="${area}" fill="url(#ga)"/>`:""}
  <path d="${line}" fill="none" stroke="var(--train)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${ws.length<=40?pts.slice(0,-1).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--surface)" stroke="var(--train)" stroke-width="1.5"/>`).join(""):""}
  <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="var(--train)" stroke="var(--surface)" stroke-width="2"/>
  <text x="${lx.toFixed(1)}" y="${(last[1]-10<pt+8?last[1]+18:last[1]-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)" font-family="Manrope,sans-serif">${kgFmt(lw.kg)}</text>
  <text x="${pl}" y="${H-8}" font-size="10" fill="var(--muted)" font-family="Manrope,sans-serif">${fmtShort(ws[0].date)}</text>
  ${ws.length>1?`<text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Manrope,sans-serif">${fmtShort(lw.date)}</text>`:""}
  </svg>`;
}

function viewProgress(){
  const ws=S.weights,goal=S.plan.goal;
  const first=ws[0],last=ws[ws.length-1];
  const diff=first&&last?last.kg-first.kg:null;
  const toGoal=goal&&last?last.kg-goal:null;
  // this week
  const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dayIdx(now));
  let trained=0,planned=0;
  const week=DAYS.map(([k,,sh],i)=>{const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),key=keyOf(d);
    const ids=S.plan.train[k].filter(exById),log=logFor(key),n=ids.filter(id=>log.ex[id]).length;
    let cls="",lbl=d.getDate();
    if(S.plan.rest[k]){cls="rest";}
    else if(ids.length){planned++;if(log.finished||n===ids.length){cls="full";trained++;}else if(n>0)cls="part";}
    if(key===todayKey())cls+=" now";
    return `<div class="wk ${cls}" title="${DAYS[i][1]}: ${S.plan.rest[k]?"одмор":log.finished?"завршен":ids.length?n+"/"+ids.length+" вежби":"без план"}"><i class="num">${lbl}</i>${sh}</div>`;}).join("");
  const hist=[...ws].reverse();
  const totalFin=Object.values(S.logs).filter(l=>l&&typeof l.finished==="number").length;
  return `<div class="stats">
   <div class="stat"><div class="lbl">Сегашна</div><div class="val num">${last?kgFmt(last.kg):"–"}<small>kg</small></div></div>
   <div class="stat"><div class="lbl">Од почеток</div><div class="val num ${diff<0?"down":diff>0?"up":""}">${diff==null?"–":(diff>0?"+":diff<0?"−":"")+kgFmt(Math.abs(diff))}<small>kg</small></div></div>
   <div class="stat"><div class="lbl">Цел</div><div class="val num">${goal?kgFmt(goal):"–"}<small>kg</small></div></div>
   <div class="stat"><div class="lbl">До целта</div><div class="val num">${toGoal==null?"–":kgFmt(Math.abs(toGoal))}<small>${toGoal==null?"":toGoal>0?"kg за симнување":toGoal<0?"kg за качување":"kg"}</small></div></div>
  </div>
  <section class="block"><div class="sec-head"><div><div class="kicker">Килажа</div><h2>Текот</h2></div>${first?`<span class="meta num">${ws.length} мерења од ${fmtShort(first.date)}</span>`:""}</div>
   <div class="card chart">${ws.length?chartSVG(ws,goal):`<div class="empty">Внеси ја првата килажа подолу и тука ќе се исцрта графиконот.</div>`}</div></section>
  <section class="block"><div class="sec-head"><div><div class="kicker">Оваа недела</div><h2>Тренинзи</h2></div><span class="meta num">${trained}/${planned} завршени</span></div>
   <div class="card week">${week}</div><p class="note">Полно = завршен тренинг · светло = делумно · испрекинато = одмор${totalFin?` · вкупно завршени тренинзи: <b class="num">${totalFin}</b>`:""}</p></section>
  <section class="block"><div class="sec-head"><h2>Ново мерење</h2></div>
   <div class="card pad"><div class="grid2"><div class="field"><label for="w-date">Датум</label><input id="w-date" type="date" value="${todayKey()}" max="${todayKey()}"></div><div class="field"><label for="w-kg">Килажа (kg)</label><input id="w-kg" inputmode="decimal" placeholder="на пр. 78,5"></div></div>
   <div class="field"><label for="w-note">Белешка (по избор)</label><input id="w-note" maxlength="80" placeholder="на пр. наутро, на празен стомак"></div>
   <button class="btn btn-primary" data-act="add-weight">Зачувај мерење</button>
   <div class="inline"><div class="field"><label for="goal">Целна килажа (kg)</label><input id="goal" inputmode="decimal" value="${goal?kgFmt(goal):""}" placeholder="на пр. 75"></div><button class="btn" data-act="save-goal">Постави цел</button></div></div></section>
  ${hist.length?`<section class="block"><div class="sec-head"><h2>Историја</h2></div><div class="card list">${hist.slice(0,60).map((w,i)=>{const prev=hist[i+1];const d=prev?w.kg-prev.kg:null;
    return `<div class="item"><div class="grow"><div class="name num">${kgFmt(w.kg)} kg</div><div class="sub">${fmtLong(w.date)}${w.note?" · "+h(w.note):""}</div></div>${d!=null&&Math.abs(d)>=.05?`<span class="num" style="font-weight:800;font-size:13px;color:${d<0?"var(--good)":"var(--bad)"}">${d>0?"+":"−"}${kgFmt(Math.abs(d))}</span>`:""}<button class="icon-btn" data-act="del-weight" data-id="${h(w.id)}" aria-label="Избриши мерење">${ICON.x}</button></div>`;}).join("")}</div></section>`:""}`;
}

async function submitExercise(form){
  const msg=(t,ok)=>{const m=$("#f-msg");m.textContent=t;m.className="form-msg"+(ok?" ok":"");};
  const id=form.dataset.id||newId(),old=exById(id);
  const name=$("#f-name").value.trim();if(!name){msg("Внеси име на вежбата.");$("#f-name").focus();return;}
  const link=$("#f-link").value.trim();if(link&&!safeLink(link)){msg("Линкот треба да почнува со https://");return;}
  let video=old?old.video||null:null;
  const file=$("#f-video")&&$("#f-video").files[0];
  if(file&&file.size>MAXB){msg("Видеото е поголемо од 100 MB. Скрати го или додај линк наместо тоа.");return;}
  const btn=$("#f-save");btn.disabled=true;
  if($("#f-novideo")&&$("#f-novideo").checked){await dropAsset(video);video=null;}
  if(file){
    msg("Се прикачува видеото… не ја затворај страницата.",true);
    try{
      if(assets){const r=await assets.upload(file);if(video)await dropAsset(video);video={id:r.id};}
      else video={localUrl:URL.createObjectURL(file)};
    }catch(e){btn.disabled=false;msg("Прикачувањето не успеа. Обиди се со помало видео или провери ја врската.");return;}
  }
  const obj={id,name,muscle:$("#f-muscle").value,sets:$("#f-sets").value.trim(),reps:$("#f-reps").value.trim(),rest:$("#f-rest").value.trim(),notes:$("#f-notes").value.trim(),link,video,createdAt:old?old.createdAt:Date.now()};
  upsert(S.exercises,obj);
  persist(refs&&refs.ex.doc(id),strip(video&&video.localUrl?{...obj,video:null}:obj));
  const isNew=!old;
  closeModal();
  if(isNew&&UI.tab==="training"&&UI.trainView==="plan"){const dk=DAYS[UI.planDay][0];if(!S.plan.rest[dk]){S.plan.train[dk].push(id);savePlan();}}
  render();toast(isNew?"Вежбата е додадена":"Вежбата е зачувана");
}

async function submitRecipe(form){

  const name=$("#r-name").value.trim();if(!name){msg("Внеси име на јадењето.");$("#r-name").focus();return;}
  let photo=old?old.photo||null:null;
  const file=$("#r-photo")&&$("#r-photo").files[0];
  if(file&&file.size>MAXB){msg("Сликата е поголема од 100 MB.");return;}
  const btn=$("#r-save");btn.disabled=true;
  if($("#r-nophoto")&&$("#r-nophoto").checked){await dropAsset(photo);photo=null;}
  if(file){msg("Се прикачува сликата…",true);
    try{if(assets){const up=await assets.upload(file);if(photo)await dropAsset(photo);photo={id:up.id};}else photo={localUrl:URL.createObjectURL(file)};}
    catch(e){btn.disabled=false;msg("Прикачувањето не успеа. Обиди се повторно.");return;}}
  const obj={id,name,cat:$("#r-cat").value,time:$("#r-time").value.trim(),kcal:$("#r-kcal").value.trim(),protein:$("#r-protein").value.trim(),servings:$("#r-serv").value.trim(),ingredients:$("#r-ing").value.trim(),steps:$("#r-steps").value.trim(),photo,createdAt:old?old.createdAt:Date.now()};
  upsert(S.recipes,obj);

  closeModal();render();toast(old?"Рецептот е зачуван":"Рецептот е додаден");
}

function loadMealPlan(){
  const byName={};S.recipes.forEach(r=>{byName[r.name.trim()]=r;});
  const slots=[["breakfast","Појадок"],["lunch","Ручек"],["dinner","Вечера"]];
  MEALPLAN.forEach(([k,meals],di)=>{
    S.plan.meals[k]={};
    meals.forEach(([name,ing,kcal,protein],j)=>{
      const [slot,cat]=slots[j];
      let r=byName[name];
      const fields={cat,kcal:String(kcal),protein:String(protein),servings:"1",ingredients:ing.split(",").map(x=>x.trim()).join("\n")};
      r=r?{...r,...fields}:{id:"m"+newId()+di+j,name,time:"",steps:"",photo:null,createdAt:Date.now()+di*5+j,...fields};
      if(!byName[name]){byName[name]=r;}
      byName[name]=r;upsert(S.recipes,r);persist(refs&&refs.rec.doc(r.id),strip(r));
      S.plan.meals[k][slot]=r.id;
    });
  });
  S.plan.mealProgram="m1";savePlan();render();toast("Планот за исхрана е вчитан за сите 7 дена");
}

    case "tog-meal":logToggle("meals",b.dataset.slot);break;

    case "unfinish":{const tk=todayKey(),l=logFor(tk);delete l.finished;S.logs[tk]=l;render();persist(refs&&refs.logs.doc(tk),l);toast("Тренингот е вратен како незавршен");break;}
    case "open-ex":exDetail(id);break;
    case "new-ex":exForm(null);break;
    case "edit-ex":exForm(id);break;
    case "del-ex":{const e=exById(id);if(!e)break;askConfirm(`Да се избрише вежбата ${e.name}? Ќе се отстрани и од неделниот план.`,"Избриши",async()=>{
        S.exercises=S.exercises.filter(x=>x.id!==id);let ch=false;DAYS.forEach(([k])=>{const n=S.plan.train[k].filter(x=>x!==id);if(n.length!==S.plan.train[k].length){S.plan.train[k]=n;ch=true;}});
        if(ch)savePlan();erase(refs&&refs.ex.doc(id));render();toast("Вежбата е избришана");await dropAsset(e.video);});break;}
    case "open-rec":recDetail(id);break;
    case "new-rec":recForm(null);break;
    case "edit-rec":recForm(id);break;
    case "del-rec":{const r=recById(id);if(!r)break;askConfirm(`Да се избрише рецептот ${r.name}? Ќе се отстрани и од планот за јадење.`,"Избриши",async()=>{
        S.recipes=S.recipes.filter(x=>x.id!==id);let ch=false;DAYS.forEach(([k])=>{const ml=S.plan.meals[k];Object.keys(ml).forEach(s=>{if(ml[s]===id){delete ml[s];ch=true;}});});
        if(ch)savePlan();erase(refs&&refs.rec.doc(id));render();toast("Рецептот е избришан");await dropAsset(r.photo);});break;}
    case "plan-add":{const sel=$("#plan-add-sel");if(!sel||!sel.value)break;const dk=DAYS[UI.planDay][0];S.plan.train[dk]=S.plan.train[dk].filter(exById);S.plan.train[dk].push(sel.value);savePlan();render();break;}
    case "plan-up":case "plan-down":case "plan-rm":{const dk=DAYS[UI.planDay][0];const arr=S.plan.train[dk].filter(exById);const j=+b.dataset.i;
        if(a==="plan-rm")arr.splice(j,1);else{const t=a==="plan-up"?j-1:j+1;if(t<0||t>=arr.length)break;[arr[j],arr[t]]=[arr[t],arr[j]];}
        S.plan.train[dk]=arr;savePlan();render();break;}
    case "copy-meals":{const src=DAYS[UI.mealDay];askConfirm(`Менито од ${src[1].toLowerCase()} ќе се копира во сите 7 дена и ќе ги замени нивните оброци.`,"Копирај",()=>{DAYS.forEach(([k])=>S.plan.meals[k]={...S.plan.meals[src[0]]});savePlan();render();toast("Менито е копирано во сите денови");});break;}
    case "q-weight":{const v=num($("#q-kg").value);addWeight(todayKey(),v,"");break;}
    case "add-weight":{const d=$("#w-date").value||todayKey();if(d>todayKey()){toast("Датумот не може да биде во иднина.");break;}if(addWeight(d,num($("#w-kg").value),$("#w-note").value.trim())){}break;}
    case "del-weight":{const w=S.weights.find(x=>x.id===id);if(!w)break;S.weights=S.weights.filter(x=>x.id!==id);erase(refs&&refs.w.doc(id));render();toast("Мерењето од "+fmtShort(w.date)+" е избришано");break;}
    case "save-goal":{const g=num($("#goal").value);if($("#goal").value.trim()===""){S.plan.goal=null;savePlan();render();toast("Целта е отстранета");break;}
        if(g==null||g<20||g>400){toast("Внеси цел помеѓу 20 и 400 kg.");break;}S.plan.goal=Math.round(g*10)/10;savePlan();render();toast("Целта е поставена: "+kgFmt(S.plan.goal)+" kg");break;}
  }
});
document.addEventListener("change",ev=>{
  const el=ev.target;const c=el.dataset&&el.dataset.change;if(!c)return;
  if(c==="plan-title"){const dk=DAYS[UI.planDay][0];const v=el.value.trim();if(S.plan.title[dk]!==v){S.plan.title[dk]=v;savePlan();}}
  if(c==="plan-rest"){const dk=DAYS[UI.planDay][0];S.plan.rest[dk]=el.checked;savePlan();render();}
  if(c==="meal"){const dk=DAYS[UI.mealDay][0];const s=el.dataset.slot;S.plan.meals[dk]=S.plan.meals[dk]||{};if(el.value)S.plan.meals[dk][s]=el.value;else delete S.plan.meals[dk][s];savePlan();render();}
});
document.addEventListener("input",ev=>{const el=ev.target;if(el.dataset&&el.dataset.input==="q"){UI.q=el.value;render();}});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target;if(f.id==="ex-form")submitExercise(f);if(f.id==="rec-form")submitRecipe(f);});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("#modal").hidden)closeModal();if(ev.key==="Enter"&&ev.target.id==="q-kg"){ev.preventDefault();addWeight(todayKey(),num(ev.target.value),"");}});

window.addEventListener("hashchange",fromHash);

/* ---------- local storage (this browser) ---------- */
const LS_KEY="trening-v1";
function localStore(){
  let data={};try{data=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{};}catch(e){data={};}
  const subs=new Set(),meta={fromCache:false,hasPendingWrites:false};
  const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){throw{code:"quota_exceeded"};}};
  const notify=()=>subs.forEach(f=>f());
  const snap=k=>({id:k.split("/").pop(),exists:k in data,data:()=>data[k],metadata:meta});
  function docRef(path){return{path,
    set:async d=>{data[path]=JSON.parse(JSON.stringify(d));save();notify();},
    delete:async()=>{delete data[path];save();notify();},
    onSnapshot(next){const f=()=>next(snap(path));subs.add(f);f();return()=>subs.delete(f);},
    collection:c=>colRef(path+"/"+c)};}
  function colRef(path){
    const q=ord=>({orderBy:f=>q(f),onSnapshot(next){const f=()=>{
      let docs=Object.keys(data).filter(k=>k.startsWith(path+"/")&&!k.slice(path.length+1).includes("/")).map(snap);
      docs.sort(ord?(a,b)=>String(a.data()[ord]).localeCompare(String(b.data()[ord])):(a,b)=>a.id.localeCompare(b.id));
      next({docs,size:docs.length,empty:!docs.length,metadata:meta});};subs.add(f);f();return()=>subs.delete(f);}});
    return Object.assign(q(null),{path,doc:id=>docRef(path+"/"+id)});}
  return{doc:docRef,collection:colRef};
}
function openIdb(){return new Promise((res,rej)=>{const r=indexedDB.open("trening-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function localAssets(){
  const d=await openIdb();const st=m=>d.transaction("files",m).objectStore("files");
  await new Promise(res=>{const req=st("readonly").openCursor();req.onsuccess=()=>{const c=req.result;if(c){BLOBS[c.key]=URL.createObjectURL(c.value);c.continue();}else res();};req.onerror=()=>res();});
  return{
    upload:file=>new Promise((res,rej)=>{const id="m"+newId();const r=st("readwrite").put(file,id);r.onsuccess=()=>{BLOBS[id]=URL.createObjectURL(file);res({id});};r.onerror=()=>rej(r.error);}),
    delete:id=>new Promise(res=>{const r=st("readwrite").delete(id);r.onsuccess=r.onerror=()=>{if(BLOBS[id])URL.revokeObjectURL(BLOBS[id]);delete BLOBS[id];res();};})
  };
}
render();
(async()=>{
  try{db=localStore();}catch(e){db=null;}
  try{assets=await localAssets();}catch(e){assets=null;}
  canUpload=!!assets;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if(!db){S.loaded=true;setBanner("Овој прелистувач не дозволува зачувување. Пробај со Chrome или Safari без приватен режим.");render();return;}
  const root=db.doc("me/app");
  refs={plan:db.doc("me/plan"),ex:root.collection("exercises"),rec:root.collection("recipes"),w:root.collection("weights"),logs:root.collection("logs")};
  const rows=snap=>snap.docs.map(d=>({...d.data(),id:d.id}));
  const ok=()=>{S.loaded=true;render();};
  refs.plan.onSnapshot(s=>{S.plan=normPlan(s.exists?s.data():null);ok();});
  refs.ex.onSnapshot(s=>{S.exercises=rows(s).filter(x=>x&&x.name);ok();});
  refs.rec.onSnapshot(s=>{S.recipes=rows(s).filter(x=>x&&x.name);ok();});
  refs.w.orderBy("date").onSnapshot(s=>{S.weights=rows(s).filter(x=>typeof x.kg==="number"&&x.date);ok();});
  refs.logs.onSnapshot(s=>{const L={};s.docs.forEach(d=>{L[d.id]=d.data();});S.logs=L;ok();});
})();
